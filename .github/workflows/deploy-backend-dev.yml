name: Build backend dev
# CI validates source; the server pulls master and builds/deploys on its own timer.

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-backend-dev.yml
      - common/**
      - chain-sdks/**
      - wallet-sig1/**
      - wallet-sig2/**
      - wallet-api/**
      - resources/docs/db/**
      - resources/infra/systemd/surprising-wallet-all.service
      - resources/infra/systemd/surprising-wallet.service
      - resources/infra/systemd/surprising-wallet-sig1.service
      - resources/infra/systemd/surprising-wallet-sig2.service
      - pom.xml
      - scripts/deploy/**
      - resources/infra/systemd/surprising-wallet-auto-update.*
      - scripts/ops/**
      - resources/infra/monitor/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-backend-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '27'
          cache: maven
      - name: Build single JAR and run unit tests
        # DB/chain integration tests run against the developer's existing PostgreSQL 18.
        run: mvn -B -pl wallet-api -am package '-Dtest=!*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false -Dproject.build.outputTimestamp="$(git show -s --format=%cI HEAD)"
      - name: Validate monitoring
        run: |
          python3 -m unittest discover -s scripts/ops/tests -v
          bash -n scripts/ops/install-monitor.sh
      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy/backend-auto-update.sh
          bash -n scripts/deploy/backend-deploy.sh
