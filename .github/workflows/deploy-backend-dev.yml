name: Deploy backend dev
# Build and test on GitHub; upload one JAR to the Alibaba Cloud all-mode service.

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-backend-dev.yml
      - common/**
      - chain-sdks/**
      - wallet-sig1/**
      - wallet-sig2/**
      - wallet-api/**
      - resources/docs/db/**
      - resources/infra/systemd/surprising-wallet-all.service
      - resources/infra/systemd/surprising-wallet.service
      - resources/infra/systemd/surprising-wallet-sig1.service
      - resources/infra/systemd/surprising-wallet-sig2.service
      - pom.xml
      - scripts/deploy/backend-deploy.sh
      - scripts/deploy/backend-deploy-trigger.sh
      - scripts/ops/**
      - resources/infra/monitor/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '27'
          cache: maven
      - name: Build single JAR and run unit tests
        # DB/chain integration tests run against the developer's existing PostgreSQL 18.
        run: mvn -B -pl wallet-api -am package '-Dtest=!*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false -Dproject.build.outputTimestamp="$(git show -s --format=%cI HEAD)"
      - name: Validate monitoring
        run: |
          python3 -m unittest discover -s scripts/ops/tests -v
          bash -n scripts/ops/install-monitor.sh
      - name: Assemble release
        run: |
          mkdir release
          cp wallet-api/target/wallet-api-1.0.0-SNAPSHOT.jar release/wallet-server.jar
          cp resources/infra/systemd/surprising-wallet-all.service release/
          cp scripts/deploy/backend-deploy.sh scripts/deploy/backend-deploy-trigger.sh release/
          tar -C release -czf wallet-release.tar.gz wallet-server.jar surprising-wallet-all.service backend-deploy.sh backend-deploy-trigger.sh
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BACKEND_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/backend_deploy"
          chmod 0600 "$HOME/.ssh/backend_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Upload and activate on Alibaba Cloud
        env:
          DEPLOY_HOST: ${{ secrets.BACKEND_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BACKEND_DEPLOY_USER }}
        run: |
          archive_sha=$(sha256sum wallet-release.tar.gz | cut -d ' ' -f 1)
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i "$HOME/.ssh/backend_deploy" "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $GITHUB_SHA $archive_sha" < wallet-release.tar.gz | tee deployment.log
          grep -Fxq 'backend deployment verified' deployment.log
