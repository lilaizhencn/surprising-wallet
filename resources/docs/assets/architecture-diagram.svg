  <text x="570" y="600" text-anchor="middle" class="desc">BTC/LTC/DOGE/BCH 本地节点</text>

  <rect x="690" y="558" width="190" height="58" class="infra"/>
  <text x="785" y="580" text-anchor="middle" class="label">Hardhat Fork</text>
  <text x="785" y="600" text-anchor="middle" class="desc">EVM EIP-7702 回归测试</text>

  <rect x="900" y="558" width="170" height="58" class="infra"/>
  <text x="985" y="580" text-anchor="middle" class="label">Polkadot Sidecar</text>
  <text x="985" y="600" text-anchor="middle" class="desc">Node.js Runtime 桥接</text>

  <!-- 底部 -->
  <text x="550" y="648" text-anchor="middle" class="desc" fill="#94a3b8" font-size="11">surprising-wallet — 5 Java 模块 · Java 27 · Spring Boot 4.1 · 28 条链 · 13 个接入组</text>
  <text x="30" y="770" class="desc">发布：GitHub Actions / JDK 27 → SSH 摘要校验 → Alibaba Cloud 单 JAR all · Nginx → loopback API / PostgreSQL</text>
  <rect x="30" y="674" width="1040" height="64" fill="#f8fafc" stroke="#94a3b8" rx="8"/>
  <text x="550" y="698" text-anchor="middle" class="desc">运行监控：systemd 每分钟 → Python 只读探针（资源 / 服务 / PostgreSQL / PGMQ / 日志 / HTTPS）→ Telegram</text>
  <text x="550" y="720" text-anchor="middle" class="desc">全部监控运行于钱包主机，直接通知 Telegram；故障与恢复通知 / 每日摘要；日志按时间与容量轮转</text>
<rect x="30" y="805" width="1040" height="108" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="50" y="832" style="font:14px sans-serif;fill:#1e293b">Cloudflare：Static Assets + Worker → 单租户 Durable Object / SQLite</text>
<text x="50" y="860" style="font:14px sans-serif;fill:#1e293b">Worker ⇄ HTTPS Custody API / HMAC Webhook ⇄ Alibaba Cloud wallet-api</text>
<text x="50" y="888" style="font:14px sans-serif;fill:#1e293b">GitHub master / resources/tenant-demo/** → 验证测试 Worker → cf deploy</text>
  <rect x="30" y="932" width="1040" height="138" class="svc"/>
  <text x="50" y="956" class="label">Console / API 认证与安全维护 · model/custody 类型记录</text>
  <text x="50" y="981" class="desc">AuthService → 用户 / 租户 / 会话；ApiKeyService → 密钥 / 租户 / IP / nonce 单表仓储</text>
  <text x="50" y="1006" class="desc">服务直接写审计；租户停用撤销会话；管理员按租户 / 角色 / 状态条件解锁</text>
  <text x="50" y="1031" class="desc">单表仓储映射类型记录；安全域无总门面 / 安全门面转发；维护直接清理 nonce / 会话 / 幂等键</text>
  <text x="50" y="1056" class="desc">列表投影无密码 / 密钥；nonce 原子占用；密文自带版本，删除两张表的闲置版本列</text>
  <rect x="30" y="1090" width="1040" height="140" class="svc"/>
  <text x="50" y="1116" class="label">Webhook：现有业务服务直接编排单表仓储；具体 HTTP 客户端负责协议</text>
  <text x="50" y="1142" class="desc">WebhookService → 端点 / 投递 / 尝试 / 事件 / 审计；HttpClient → URL / UTF-8 HMAC / 超时 / 有界响应</text>
  <text x="50" y="1168" class="desc">领取与回执同事务；结果按全局代次提交；状态 / 回执 / 端点时间原子更新</text>
  <text x="50" y="1194" class="desc">HTTP 验证后才开启短事务激活；类型投影无密文；创建记录实际操作者</text>
  <text x="50" y="1218" class="desc">移除闲置校验哈希；终态无重试时间；手动新周期保留全局历史；投递器仅一个正常构造器</text>
  <rect x="30" y="1250" width="1040" height="100" class="svc"/>
  <text x="50" y="1276" class="label">提现投影：现有对账服务直接编排；入口只传租户与提现 ID</text>
  <text x="50" y="1302" class="desc">事务内锁定投影并读取当前订单；本金流水 / Gas / 事件一起提交；固定页扫描避免旧记录阻塞</text>
  <text x="50" y="1328" class="desc">无状态快照 DTO / 总仓储转发 / 订单回写；当前订单决定扣款事实，失败整体回滚</text>
  <rect x="30" y="1370" width="1040" height="120" class="svc"/>
  <text x="50" y="1396" class="label">Gas：AccountingService 拥有资金事务；ReconciliationService 读取确认事实</text>
  <text x="50" y="1422" class="desc">操作行锁 → 归属 / 收据 → Gas 账户锁 → 冻结 / 结算 + 状态 / 原生币流水原子提交</text>
  <text x="50" y="1448" class="desc">重复预留复用收据；OVERDUE 按已观察费用补结算；未知交易保留锁，超时不等于完成</text>
  <text x="50" y="1474" class="desc">分页对账避免旧预留阻塞；金额最多 18 位小数 / 54 位整数；不新增表 / 状态 / 兼容迁移</text>
  <rect x="30" y="1530" width="1040" height="100" class="svc"/>
  <text x="50" y="1556" class="label">提现结算：四个身份参数 → 所属订单行锁 → 订单扣款事实 → 余额 / 确认同事务</text>
  <text x="50" y="1582" class="desc">链服务不再传币种 / 账户 / 扣款金额；重复确认无副作用；缺少账户拒绝结算</text>
  <text x="50" y="1608" class="desc">UTXO 先核对上链请求与订单；提现 RBF 客户费用保持，归集按上链尝试恢复输出与矿工费</text>
  <rect x="30" y="1650" width="1040" height="165" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="50" y="1680" style="font:13px sans-serif;fill:#1e293b">托管控制面：删除通用 / 看板仓储门面；写入与查询由实际应用服务拥有</text>
  <text x="50" y="1716" style="font:13px sans-serif;fill:#1e293b">Controller → TenantQueryService / AssetDashboardService；TenantService 拥有租户写事务</text>
  <text x="50" y="1752" style="font:13px sans-serif;fill:#1e293b">GasService 批量组合定义 / 地址 / 原生币余额；租户链直接查定义与地址，依赖无环</text>
  <text x="50" y="1788" style="font:13px sans-serif;fill:#1e293b">单表仓储返回类型记录；链 + 精确账户身份；历史持仓与当前配置展示分开</text>
  <rect x="30" y="1880" width="1040" height="155" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="50" y="1908" style="font:13px sans-serif;fill:#1e293b">EIP-7702：工作流直接查询；现有协调器拥有批次状态与账务事务</text>
  <text x="50" y="1942" style="font:13px sans-serif;fill:#1e293b">Coordinator → 单表批次 / 项目 / 尝试 / 订单 / Nonce / Gas；删除两层业务仓储</text>
  <text x="50" y="1976" style="font:13px sans-serif;fill:#1e293b">ConfigurationService 只校验新配置与中继路径；配置单表唯一类型映射</text>
  <text x="50" y="2010" style="font:13px sans-serif;fill:#1e293b">批次与尝试 UNKNOWN 共同回滚；历史回执按原版本确认，不依赖新签名开关</text>
  <rect x="30" y="2055" width="1040" height="165" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="50" y="2083" style="font:13px sans-serif;fill:#1e293b">租户链服务：类型化批量组合 / 一致快照 / 开关审计事务；移除三个业务仓储门面</text>
  <text x="50" y="2117" style="font:13px sans-serif;fill:#1e293b">DevFaucetService：批量候选与去重 → 条件领取 → RPC / UNKNOWN 恢复 / 对账</text>
  <text x="50" y="2151" style="font:13px sans-serif;fill:#1e293b">HyperCore 扫描器与交易服务直接读写元数据 / 操作；HyperCoreDepositService 只拥有快照入账事务</text>
  <text x="50" y="2185" style="font:13px sans-serif;fill:#1e293b">快照行锁 / 增量 / 充值 / 账本 / 租户投影共同提交；只有正常注入构造器，无数据库变更</text>
</svg>
