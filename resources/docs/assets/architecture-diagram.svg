<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
  <style>
    .svc   { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
    .lib   { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 10; }
    .chain { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 8; }
    .infra { fill: #faf5ff; stroke: #9333ea; stroke-width: 2; rx: 10; }
    .label { font: 14px sans-serif; font-weight: 700; fill: #1e293b; }
    .desc  { font: 11px sans-serif; fill: #475569; }
    .title { font: 20px sans-serif; font-weight: 700; fill: #0f172a; }
    .sep   { font: 13px sans-serif; font-weight: 600; fill: #94a3b8; }
    .arrow { stroke: #94a3b8; stroke-width: 1.5; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L8,2.5 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="30" y="28" class="title">Surprising Wallet —  Architecture</text>

  <!-- ====== 第一层：SDK & 共享库 ====== -->
  <text x="30" y="58" class="sep"> 共享库 &amp; SDK</text>

  <rect x="30"  y="70" width="200" height="78" class="lib"/>
  <text x="130" y="98" text-anchor="middle" class="label">common</text>
  <text x="130" y="118" text-anchor="middle" class="desc">跨模块契约 · 签名 DTO · 密钥校验</text>
  <text x="130" y="135" text-anchor="middle" class="desc">PGMQ JDBC 适配器 · 无 Web 依赖</text>

  <rect x="250" y="70" width="200" height="78" class="lib"/>
  <text x="350" y="98" text-anchor="middle" class="label">chain-sdks</text>
  <text x="350" y="118" text-anchor="middle" class="desc">BitcoinJ · UTXO 多签 · BIP32</text>
  <text x="350" y="135" text-anchor="middle" class="desc">RPC DTO · Ed25519 · TRON gRPC</text>

  <!-- ====== 第二层：应用服务 ====== -->
  <text x="30" y="180" class="sep"> 唯一 JAR：all / api / sig1 / sig2；箭头表示依赖方指向提供方</text>

  <rect x="30"  y="194" width="665" height="118" class="svc"/>
  <text x="362" y="219" text-anchor="middle" class="label">wallet-api · Spring MVC 单体应用</text>
  <text x="362" y="241" text-anchor="middle" class="desc">Web：controller/** · job/** · config/** · exception/** · filter/** · model/**</text>
  <text x="362" y="259" text-anchor="middle" class="desc">Application：service/** · Workflow · 业务编排与状态流转</text>
  <text x="362" y="277" text-anchor="middle" class="desc">Domain/Infrastructure：chain/** · repository/** · gateway/** · coordinator/** · observer/**</text>
  <text x="362" y="295" text-anchor="middle" class="desc">SQL @Repository：一表一仓储 · @Component 门面仅做 Java 组合</text>

  <rect x="720" y="194" width="340" height="100" class="svc"/>
  <text x="890" y="222" text-anchor="middle" class="label">wallet-sig1 · wallet-sig2 普通库</text>
  <text x="890" y="244" text-anchor="middle" class="desc">all 共享池；独立模式各自数据库账号</text>
  <text x="890" y="262" text-anchor="middle" class="desc">BTC/BCH/LTC/DOGE → 第一签 → 第二签</text>
  <text x="890" y="280" text-anchor="middle" class="desc">独立调度池 · 事务推进与消息归档</text>

  <line x1="695" y1="210" x2="720" y2="210" class="arrow"/>
  <!-- consumers → providers -->
  <line x1="270" y1="194" x2="130" y2="148" class="arrow"/>
  <line x1="470" y1="194" x2="350" y2="148" class="arrow"/>
  <line x1="810" y1="194" x2="130" y2="148" class="arrow"/>
  <line x1="890" y1="194" x2="350" y2="148" class="arrow"/>

