  <text x="30" y="28" class="title">Surprising Wallet —  Architecture</text>

  <!-- ====== 第一层：SDK & 共享库 ====== -->
  <text x="30" y="58" class="sep"> 共享库 &amp; SDK</text>

  <rect x="30"  y="70" width="200" height="78" class="lib"/>
  <text x="130" y="98" text-anchor="middle" class="label">common</text>
  <text x="130" y="118" text-anchor="middle" class="desc">UTXO 请求 · 部分签名 · 结果</text>
  <text x="130" y="135" text-anchor="middle" class="desc">PGMQ JDBC 适配器 · 无 Web 依赖</text>

  <rect x="250" y="70" width="200" height="78" class="lib"/>
  <text x="350" y="98" text-anchor="middle" class="label">chain-sdks</text>
  <text x="350" y="118" text-anchor="middle" class="desc">BitcoinJ · UTXO 多签 · BIP32</text>
  <text x="350" y="135" text-anchor="middle" class="desc">RPC DTO · Ed25519 · TRON gRPC</text>

  <!-- ====== 第二层：应用服务 ====== -->
  <text x="30" y="180" class="sep"> 唯一 JAR：all / api / sig1 / sig2；箭头表示依赖方指向提供方</text>

  <rect x="30"  y="194" width="665" height="118" class="svc"/>
  <text x="362" y="219" text-anchor="middle" class="label">wallet-api · Spring MVC 单体应用</text>
  <text x="362" y="241" text-anchor="middle" class="desc">Web：controller/** · job/** · config/** · exception/** · filter/** · model/**</text>
  <text x="362" y="259" text-anchor="middle" class="desc">Application：单表仓储直达 · 归集计划 / UTXO 选择 / 提现领取 / 批次归属</text>
  <text x="362" y="277" text-anchor="middle" class="desc">Domain/Infrastructure：链客户端（7702 共用 RPC / 费用回执）· 单表仓储 · 协调器</text>
  <text x="362" y="295" text-anchor="middle" class="desc">查询：地址 / Gas 直接单表筛选分页 · 充提当前页批量组合</text>

  <rect x="720" y="194" width="340" height="100" class="svc"/>
  <text x="890" y="222" text-anchor="middle" class="label">wallet-sig1 · wallet-sig2 普通库</text>
  <text x="890" y="244" text-anchor="middle" class="desc">all 共享池；独立模式各自数据库账号</text>
  <text x="890" y="262" text-anchor="middle" class="desc">BTC/BCH/LTC/DOGE → 第一签 → 第二签</text>
  <text x="890" y="280" text-anchor="middle" class="desc">构造器依赖 · 请求网络 · 角色密钥 · 无业务状态</text>

  <line x1="695" y1="210" x2="720" y2="210" class="arrow"/>
