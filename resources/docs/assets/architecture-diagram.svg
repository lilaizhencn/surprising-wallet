  <!-- ====== 第四层：基础设施 ====== -->
  <text x="30" y="545" class="sep"> 基础设施</text>

  <rect x="30"  y="558" width="230" height="58" class="infra"/>
  <text x="145" y="580" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="145" y="600" text-anchor="middle" class="desc">多租户账本 · 数据库租约 · 入队凭据 · 审计</text>

  <rect x="280" y="558" width="170" height="58" class="infra"/>
  <text x="365" y="580" text-anchor="middle" class="label">PGMQ（PG 扩展）</text>
  <text x="365" y="600" text-anchor="middle" class="desc">JDBC · 行锁 · 归档 · 死信</text>

