# wallet-sig1 唯一运行配置（当前用于 test2）；修改后需重启进程。
server:
  # 服务端口；同机部署时不要与 wallet-api/wallet-sig2 冲突。
  port: ${SW_SIG1_HTTP_PORT:8004}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SW_DB_URL:jdbc:postgresql://127.0.0.1:5432/wallet}
    username: ${SW_SIG1_DB_USERNAME:wallet_sig1}
    password: ${SW_SIG1_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 6
  sql:
    init:
      mode: never
  lifecycle:
    # 为签名轮询任务和 PostgreSQL / PGMQ 连接预留有序关闭时间。
    timeout-per-shutdown-phase: 60s
  task:
    scheduling:
      pool:
        # sig1 定时轮询独立线程池大小。
        size: 4
      # 线程名前缀，用于日志和线程栈定位。
      thread-name-prefix: sig1-scheduler-
      shutdown:
        # 关闭时等待当前签名任务完成，避免任务状态停在处理中。
        await-termination: true
        await-termination-period: 60s
  application:
    # Spring 应用名。
    name: wallet-sig1

logging:
  level:
    # 根日志级别；常规运行使用 INFO。
    default: INFO

sw:
  wallet:
    # 与 wallet-api、wallet-sig2 保持一致；本进程只保留 sig1 私钥。
    # 每个值必须是 Base64 编码的 32 字节 Seed，且四个值不能重复。
    keys:
      sig1-seed: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      sig2-seed: YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmI=
      recovery-seed: Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=
      ed25519-seed: ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ=
    # 当前钱包网络类别；必须与 wallet-api、wallet-sig2 一致。
    network: ${SW_WALLET_NETWORK:test}
